spring.application.name=IngSistemiWeb_App

# Tutti i valori sensibili sono letti da variabili d'ambiente (vedi .env.example).
# I default permettono l'avvio in locale con un MySQL su localhost e Mailpit.

# Configurazione MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/Web_app?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurazione Hibernate/JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

# Configurazione Thymeleaf
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.check-template-location=true

# Upload immagini aule
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload-dir=${UPLOAD_DIR:./uploads}

# Dati dimostrativi (utenti e aule) creati al primo avvio se il database e' vuoto
app.seed-demo-data=${SEED_DEMO_DATA:true}

# Configurazione Email (default: Mailpit, un finto server SMTP che cattura i messaggi)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.protocol=smtp
app.mail.from=${MAIL_FROM:noreply@gestione-aule.local}
