<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <title>Gestione Utenti</title>
    <link rel="stylesheet" th:href="@{/css/bulma/css/bulma.css}">
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<hr style="height: 3px; background-color: #3e77c1; border: none; margin: 0;">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<hr style="height: 3px; background-color: #3e77c1; border: none; margin: 0;">

<section class="section">
    <div class="container">
        <h1 class="title">Gestione Utenti del Sistema</h1>

        <div class="box">
            <div class="columns is-vcentered">
                <div class="column">
                    <div class="field">
                        <p class="control has-icons-left">
                            <input class="input" type="text" id="user-search-input" placeholder="Cerca per nome, cognome o email...">
                            <span class="icon is-small is-left">
                                <i class="fas fa-search"></i>
                            </span>
                        </p>
                    </div>
                </div>
                <div class="column is-narrow">
                    <div class="field is-grouped" id="role-filter-buttons">
                        <p class="control"><button class="button is-link" data-filtro="tutti">Tutti</button></p>
                        <p class="control"><button class="button" data-filtro="STUDENTE">Studenti</button></p>
                        <p class="control"><button class="button" data-filtro="PROFESSORE">Professori</button></p>
                        <p class="control"><button class="button" data-filtro="AMMINISTRATORE">Admin</button></p>
                    </div>
                </div>
            </div>
        </div>

        <div class="box">
            <table class="table is-fullwidth is-striped is-hoverable">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Cognome</th>
                    <th>Email</th>
                    <th>Ruolo</th>
                    <th>Azioni</th>
                </tr>
                </thead>
                <tbody id="users-table-body">
                </tbody>
            </table>

            <div class="has-text-centered mt-4">
                <button class="button is-primary is-hidden" id="mostra-di-piu-btn">Mostra di più</button>
            </div>
        </div>
    </div>
</section>

<div class="modal" id="edit-user-modal">
    <div class="modal-background"></div>
    <div class="modal-card">
        <header class="modal-card-head">
            <p class="modal-card-title">Modifica Utente</p>
            <button class="delete" aria-label="close"></button>
        </header>
        <section class="modal-card-body">
            <input type="hidden" id="edit-user-id">
            <div class="field">
                <label class="label">Nome</label>
                <div class="control"><input class="input" type="text" id="edit-user-nome"></div>
            </div>
            <div class="field">
                <label class="label">Cognome</label>
                <div class="control"><input class="input" type="text" id="edit-user-cognome"></div>
            </div>
            <div class="field">
                <label class="label">Email</label>
                <div class="control"><input class="input" type="email" id="edit-user-email"></div>
            </div>
            <div class="field">
                <label class="label">Nuova Password</label>
                <div class="control"><input class="input" type="password" id="edit-user-password" placeholder="Lasciare vuoto per non modificare"></div>
            </div>
        </section>
        <footer class="modal-card-foot">
            <button class="button is-success" id="save-user-button">Salva modifiche</button>
            <button class="button">Annulla</button>
        </footer>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/javascript/adminuser.js}"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
</body>
</html>
