<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <!-- Meta tags essenziali per la configurazione della pagina -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Homepage</title>

    <!-- Fogli di stile CSS -->
    <link rel="stylesheet" th:href="@{/css/bulma/css/bulma.css}">
    <link rel="stylesheet" th:href="@{/css/carosello.css}">

</head>
<body>

<!-- Header comune -->
<div th:replace="~{fragments/header :: header}"></div>

<hr style="height: 3px; background-color: #3e77c1; border: none; margin: 0;">

<!-- Navbar di navigazione -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<hr style="height: 3px; background-color: #3e77c1; border: none; margin: 0;">

<!-- Sezione principale con titolo e descrizione -->
<section class="section">
    <div class="container">
        <h1 class="title is-4">Benvenuto nel sistema di prenotazione aule studio</h1>
        <p class="subtitle is-6">Prenota facilmente eseguendo il login al tuo account o registrati</p>
    </div>
    <hr>

    <!-- Inizializzazione dati aule dal backend -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        const aule = /*[[${aule}]]*/ []; // Dati aule dal controller Spring
        /*]]>*/
    </script>

    <!-- Carosello aule -->
    <div id="carousel-container">
        <div class="columns">
            <!-- Visualizzazione immagine aula -->
            <div class="column is-half">
                <figure class="image aula-img-wrapper">
                    <img id="aula-image" src="/images/aulaAlpha.jpg" alt="Immagine aula">
                </figure>
            </div>

            <!-- Informazioni dettagliate aula -->
            <div class="column">
                <h3 id="aula-nome">Caricamento...</h3>
                <div class="content">
                    <p>Capienza: <span id="aula-capienza"></span> posti</p>
                    <p>Risorse: <span id="aula-risorse"></span></p>
                    <p>Orari: <span id="aula-orari"></span></p>
                    <p>Posti occupati ora: <span id="aula-posti-occupati">?</span> posti</p>
                    <p>Stato: <span id="aula-attiva" class="tag is-light"></span></p>
                </div>
            </div>
        </div>

        <!-- Controlli navigazione carosello -->
        <div class="buttons is-centered mt-4">
            <button class="button is-primary" onclick="prevAula()">← Precedente</button>
            <button class="button is-primary" onclick="nextAula()">Successiva →</button>
        </div>
    </div>
</section>

<hr>
<!-- Sezione annunci -->
<section class="section" id="annunciSection">
    <div class="container">
        <h2 class="title is-4">Annunci Importanti</h2>
        <div id="annunciContainer">
            <p class="has-text-grey">Nessun annuncio disponibile al momento.</p>
        </div>
    </div>
</section>

<!-- Footer comune -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Librerie JavaScript esterne -->
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>

<!-- Script applicazione -->
<script th:src="@{/javascript/homedisplayaule.js}"></script>
<script th:src="@{/javascript/homedisplayannunci.js}"></script>

</body>
</html>
