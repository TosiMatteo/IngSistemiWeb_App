<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6" lang="it">

<nav th:fragment="navbar" class="navbar has-background-info-dark" role="navigation" aria-label="main navigation">

    <div class="navbar-brand">
        <div class="navbar-item">
            <a class="button is-link" th:href="@{/index}">
                <span class="icon is-small">
                    <i class="fas fa-home"></i>
                </span>
                <span>Home</span>
            </a>
        </div>
    </div>

    <div class="navbar-menu">
        <div class="navbar-start">
            <div class="navbar-item" sec:authorize="hasRole('AMMINISTRATORE')">
                <a th:href="@{/admin/annunci}" class="button is-link">
                    <span class="icon is-small">
                        <i class="fa-solid fa-bullhorn"></i>
                    </span>
                    <span>Gestione Annunci</span>
                </a>
            </div>
            <div class="navbar-item" sec:authorize="hasRole('AMMINISTRATORE')">
                <a th:href="@{/admin/users}" class="button is-link">
                <span class="icon is-small">
                    <i class="fas fa-users-cog"></i>
                </span>
                    <span>Gestione Utenti</span>
                </a>
            </div>
        </div>
        <div class="navbar-end">
            <div class="navbar-item" sec:authorize="hasRole('STUDENTE')">
                <a class="button is-link" th:href="@{/studenteDashboard}">
                    <span class="icon is-small">
                        <i class="fas fa-chart-line"></i> </span>
                    <span>Dashboard Studente</span>
                </a>
            </div>
            <div class="navbar-item" sec:authorize="hasRole('AMMINISTRATORE')">
                <a class="button is-link" th:href="@{/amministratoreDashboard}">
                    <span class="icon is-small">
                        <i class="fas fa-chart-pie"></i> </span>
                    <span>Dashboard Amministratore</span>
                </a>
            </div>
            <div class="navbar-item" sec:authorize="hasRole('PROFESSORE')">
                <a class="button is-link" th:href="@{/professoreDashboard}">
                    <span class="icon is-small">
                        <i class="fas fa-chalkboard-teacher"></i> </span>
                    <span>Dashboard Professore</span>
                </a>
            </div>

            <div class="navbar-item" sec:authorize="isAuthenticated()">
                <form th:action="@{/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="button is-link">
                        <span class="icon is-small">
                            <i class="fa-solid fa-right-to-bracket"></i>
                        </span>
                        <span>Logout</span>
                    </button>
                </form>
            </div>

            <div class="navbar-item" sec:authorize="isAnonymous()">
                <a class="button is-link" th:href="@{/login}">
                    <span class="icon is-small">
                        <i class="fa-solid fa-right-to-bracket"></i>
                    </span>
                    <span>Login</span>
                </a>
            </div>
        </div>
    </div>
</nav>

</html>
