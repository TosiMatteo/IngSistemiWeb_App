# Configurazione usata solo dai test: database H2 in memoria, nessun servizio esterno richiesto.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;NON_KEYWORDS=USER,VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
app.upload-dir=${java.io.tmpdir}/ingsistemiweb-test-uploads
app.seed-demo-data=true
app.mail.from=test@localhost
spring.mail.host=localhost
spring.mail.port=1025
